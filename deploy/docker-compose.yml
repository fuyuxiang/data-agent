version: '3.8'

services:
  # 后端 API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "${DATABASE_URL:-sqlite:///./data/chatbot.db}"
      LLM_BASE_URL: "${LLM_BASE_URL:-https://your-openai-compatible-endpoint}"
      LLM_API_KEY: "${LLM_API_KEY:-change-me}"
      LLM_MODEL: "${LLM_MODEL:-your-model-name}"
      VL_BASE_URL: "${VL_BASE_URL:-}"
      VL_API_KEY: "${VL_API_KEY:-}"
      VL_MODEL: "${VL_MODEL:-}"
      EMBEDDING_QWEN_API_URL: "${EMBEDDING_QWEN_API_URL:-}"
      RERANKER_API_URL: "${RERANKER_API_URL:-}"
    volumes:
      - ./backend:/app
      - ./data:/app/data
    depends_on:
      - db
    restart: unless-stopped

  # 前端
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

  # 数据库（可选）
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-chatbot}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-change-me}"
      POSTGRES_DB: "${POSTGRES_DB:-chatbot}"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
