[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "meridian-analytics-workbench"
version = "1.0.0"
description = "Vue 3 and Python data analysis agent workbench"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["backend/reference_analysis", "backend/reference_clean", "backend/reference_output"]
