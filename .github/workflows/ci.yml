name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y unixodbc-dev postgresql mysql-server
      - name: Start PostgreSQL and MySQL
        run: |
          sudo systemctl start postgresql mysql
          pg_isready -h 127.0.0.1
          sudo mysqladmin ping
      - name: Configure PostgreSQL test database
        run: |
          sudo -u postgres psql -c "CREATE ROLE meridian LOGIN PASSWORD 'meridian-ci-password'"
          sudo -u postgres createdb --owner=meridian meridian
          PGPASSWORD=meridian-ci-password psql -h 127.0.0.1 -U meridian -d meridian -c 'SELECT 1'
      - name: Configure MySQL test database
        run: |
          sudo mysql -e "CREATE DATABASE meridian; CREATE USER 'meridian'@'127.0.0.1' IDENTIFIED BY 'meridian-ci-password'; CREATE USER 'meridian'@'localhost' IDENTIFIED BY 'meridian-ci-password'; GRANT ALL PRIVILEGES ON meridian.* TO 'meridian'@'127.0.0.1'; GRANT ALL PRIVILEGES ON meridian.* TO 'meridian'@'localhost';"
          mysql -h 127.0.0.1 -u meridian -pmeridian-ci-password -e 'SELECT 1'
      - name: Install Python dependencies
        run: python -m pip install --require-hashes --requirement requirements-dev.lock
      - name: Verify Python
        run: |
          ruff check backend scripts tests app.py
          ruff check --select S backend scripts app.py
          python -m compileall -q backend scripts app.py
          pytest -q -m "not database_integration" \
            --cov=backend/agent --cov=backend/api --cov=backend/core --cov=backend/services \
            --cov-report=term --cov-fail-under=60
          coverage report --include='backend/agent/*' --fail-under=85
      - name: Verify PostgreSQL and MySQL connectors
        env:
          MERIDIAN_DATABASE_ALLOW_PRIVATE_NETWORK: "1"
          MERIDIAN_DATABASE_HOST_ALLOWLIST: 127.0.0.1
          MERIDIAN_TEST_POSTGRES_URL: postgresql+psycopg2://meridian:meridian-ci-password@127.0.0.1:5432/meridian
          MERIDIAN_TEST_MYSQL_URL: mysql+pymysql://meridian:meridian-ci-password@127.0.0.1:3306/meridian
        run: pytest -q -m database_integration tests/test_database_integration.py
      - name: Audit locked production dependencies
        run: pip-audit -r requirements.lock --no-deps --disable-pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install locked browser dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Verify production frontend
        run: |
          (cd frontend/vendor && sha256sum --check SHA256SUMS)
          npm audit --audit-level=high
          npm run check
          npm run build
          npm run test:browser
          node --check frontend/dist/src/app.js
          node --check frontend/dist/src/api.js
      - name: Run aggregate code/function verifier
        env:
          MERIDIAN_DATABASE_ALLOW_PRIVATE_NETWORK: "1"
          MERIDIAN_DATABASE_HOST_ALLOWLIST: 127.0.0.1
          MERIDIAN_TEST_POSTGRES_URL: postgresql+psycopg2://meridian:meridian-ci-password@127.0.0.1:5432/meridian
          MERIDIAN_TEST_MYSQL_URL: mysql+pymysql://meridian:meridian-ci-password@127.0.0.1:3306/meridian
        run: python scripts/verify_advanced_agent.py --profile ci
