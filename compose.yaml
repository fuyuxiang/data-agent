services:
  analytics-workbench:
    build: .
    ports:
      - "127.0.0.1:${MERIDIAN_PORT:-5001}:5001"
    environment:
      MERIDIAN_ENV: production
      MERIDIAN_SECRET_KEY: ${MERIDIAN_SECRET_KEY:?MERIDIAN_SECRET_KEY must be set}
      MERIDIAN_ENCRYPTION_KEY: ${MERIDIAN_ENCRYPTION_KEY:?MERIDIAN_ENCRYPTION_KEY must be set}
      MERIDIAN_BACKUP_KEY: ${MERIDIAN_BACKUP_KEY:?MERIDIAN_BACKUP_KEY must be set}
      MERIDIAN_COOKIE_SECURE: ${MERIDIAN_COOKIE_SECURE:-1}
      MERIDIAN_ALLOWED_ORIGINS: ${MERIDIAN_ALLOWED_ORIGINS:-}
      MERIDIAN_TRUSTED_HOSTS: ${MERIDIAN_TRUSTED_HOSTS:?MERIDIAN_TRUSTED_HOSTS must be set}
      MERIDIAN_OUTBOUND_HOST_ALLOWLIST: ${MERIDIAN_OUTBOUND_HOST_ALLOWLIST:?MERIDIAN_OUTBOUND_HOST_ALLOWLIST must be set}
      MERIDIAN_DATABASE_HOST_ALLOWLIST: ${MERIDIAN_DATABASE_HOST_ALLOWLIST:-}
      MERIDIAN_DATABASE_ALLOW_PRIVATE_NETWORK: ${MERIDIAN_DATABASE_ALLOW_PRIVATE_NETWORK:-0}
      MERIDIAN_MAX_ANALYSIS_ROWS: ${MERIDIAN_MAX_ANALYSIS_ROWS:-100000}
      MERIDIAN_MAX_ANALYSIS_CELLS: ${MERIDIAN_MAX_ANALYSIS_CELLS:-2000000}
      MERIDIAN_MAX_PENDING_JOBS: ${MERIDIAN_MAX_PENDING_JOBS:-100}
      MERIDIAN_MAX_WORKSPACE_JOBS: ${MERIDIAN_MAX_WORKSPACE_JOBS:-25}
      MERIDIAN_SANDBOX_PROXY_URL: http://sandbox-proxy:8090
      MERIDIAN_SANDBOX_PROXY_TOKEN: ${MERIDIAN_SANDBOX_PROXY_TOKEN:?MERIDIAN_SANDBOX_PROXY_TOKEN must be set}
      MERIDIAN_SANDBOX_IMAGE: ${MERIDIAN_SANDBOX_IMAGE:-meridian-sandbox:py311-20260906}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
    volumes:
      - meridian-data:/app/storage
    depends_on:
      sandbox-proxy:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: ${MERIDIAN_MEMORY_LIMIT:-4g}
    cpus: ${MERIDIAN_CPU_LIMIT:-4.0}
    pids_limit: 512
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  sandbox-proxy:
    build:
      context: .
      dockerfile: deploy/sandbox/proxy.Dockerfile
    environment:
      MERIDIAN_SANDBOX_PROXY_TOKEN: ${MERIDIAN_SANDBOX_PROXY_TOKEN:?MERIDIAN_SANDBOX_PROXY_TOKEN must be set}
      MERIDIAN_SANDBOX_STORAGE_VOLUME: ${MERIDIAN_SANDBOX_STORAGE_VOLUME:-meridian-data}
      MERIDIAN_SANDBOX_IMAGE: ${MERIDIAN_SANDBOX_IMAGE:-meridian-sandbox:py311-20260906}
      MERIDIAN_SANDBOX_MEMORY_MB: ${MERIDIAN_SANDBOX_MEMORY_MB:-512}
      MERIDIAN_SANDBOX_CPUS: ${MERIDIAN_SANDBOX_CPUS:-1}
      MERIDIAN_SANDBOX_PIDS: ${MERIDIAN_SANDBOX_PIDS:-128}
      MERIDIAN_SANDBOX_TIMEOUT_SECONDS: ${MERIDIAN_SANDBOX_TIMEOUT_SECONDS:-120}
    volumes:
      - meridian-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: ${MERIDIAN_SANDBOX_PROXY_MEMORY_LIMIT:-256m}
    cpus: ${MERIDIAN_SANDBOX_PROXY_CPU_LIMIT:-1.0}
    pids_limit: 256
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8090/health"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  sandbox-image:
    image: ${MERIDIAN_SANDBOX_IMAGE:-meridian-sandbox:py311-20260906}
    build:
      context: deploy/sandbox
    profiles: ["sandbox-build"]
    command: ["true"]

volumes:
  meridian-data:
    name: ${MERIDIAN_SANDBOX_STORAGE_VOLUME:-meridian-data}
