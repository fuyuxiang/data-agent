services:
  analytics-workbench:
    build: .
    ports:
      - "5001:5001"
    environment:
      MERIDIAN_SECRET_KEY: ${MERIDIAN_SECRET_KEY:-replace-before-production}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
    volumes:
      - meridian-data:/app/storage
    restart: unless-stopped

volumes:
  meridian-data:

